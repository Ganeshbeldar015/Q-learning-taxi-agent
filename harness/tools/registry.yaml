tools:
  - name: file_read
    kind: builtin
    purpose: Read repository source files, configs, and documentation
    allowed_roles:
      - orchestrator
      - po-spec
      - designer
      - tech-lead
      - test-author
      - builder
      - reviewer
      - security
      - qa
      - scribe
      - librarian
    approval: auto

  - name: file_write
    kind: builtin
    purpose: Create or edit files within role-scoped allow-list
    allowed_roles:
      - orchestrator
      - po-spec
      - designer
      - tech-lead
      - test-author
      - builder
      - reviewer
      - security
      - qa
      - scribe
      - librarian
    approval: auto
    guard: scripts/guard_paths.py

  - name: bash
    kind: bash
    purpose: Execute tests, linters, training runs, and evaluations
    allowed_roles:
      - orchestrator
      - builder
      - test-author
      - qa
      - security
    approval: auto
    sandbox: harness/tools/sandbox.md

  - name: git
    kind: bash
    purpose: Manage branches, worktrees, and commits
    allowed_roles:
      - orchestrator
      - builder
    approval: auto
    forbid:
      - "push --force"
      - "reset --hard origin"

  - name: package_install
    kind: bash
    purpose: Install dependencies via pip
    allowed_roles:
      - builder
    approval: confirm

  - name: deploy
    kind: bash
    purpose: Production or cloud deployment
    allowed_roles: []
    approval: forbidden
