seed: 42
env: Taxi-v4
train:
  episodes: 10000
  alpha: 0.7
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_min: 0.01
  epsilon_decay: 0.999
  schedule: multiplicative
  max_steps: 200
eval:
  every: 100
  episodes: 50
  validation_seed_offset: 5000
  test_episodes: 1000
  test_seed_offset: 10000
  convergence_threshold: 7.0
  convergence_patience: 3
